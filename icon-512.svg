<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0f172a"/>
  
  <!-- Code braces -->
  <text x="96" y="340" font-family="monospace" font-size="220" font-weight="bold" fill="#38bdf8">{</text>
  <text x="320" y="340" font-family="monospace" font-size="220" font-weight="bold" fill="#38bdf8">}</text>
  
  <!-- Gavel head -->
  <rect x="168" y="200" width="176" height="64" rx="12" fill="#fbbf24"/>
  <!-- Gavel handle -->
  <rect x="232" y="264" width="48" height="120" rx="8" fill="#f59e0b"/>
  <!-- Gavel face highlight -->
  <rect x="168" y="200" width="176" height="20" rx="12" fill="#fcd34d" opacity="0.4"/>
