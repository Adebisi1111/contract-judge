<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="scaleGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Subtle glow behind center -->
  <ellipse cx="400" cy="230" rx="180" ry="180" fill="#3b82f6" opacity="0.06"/>

  <!-- Stick figure with arms outstretched inside blue arc -->
  <g transform="translate(400, 230)" opacity="0.25">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="0" cy="-35" r="10" fill="#94a3b8"/>
    <line x1="0" y1="-25" x2="0" y2="15" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-30" y1="-15" x2="30" y2="-15" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="15" x2="-15" y2="35" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="15" x2="15" y2="35" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Document icon with checkmark -->
  <g transform="translate(370, 140)">
    <rect x="0" y="0" width="60" height="72" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <path d="M0 8 L60 8 L60 0 L0 0 Z" fill="#334155"/>
    <line x1="12" y1="22" x2="48" y2="22" stroke="#475569" stroke-width="1.5"/>
    <line x1="12" y1="32" x2="48" y2="32" stroke="#475569" stroke-width="1.5"/>
    <line x1="12" y1="42" x2="35" y2="42" stroke="#475569" stroke-width="1.5"/>
    <path d="M18 52 L24 58 L36 44" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Balance Scale of Justice -->
  <g transform="translate(400, 220)">
    <rect x="-3" y="0" width="6" height="80" fill="#94a3b8"/>
    <path d="M-30 80 L30 80 L20 90 L-20 90 Z" fill="#94a3b8"/>
    <rect x="-50" y="-8" width="100" height="6" rx="2" fill="url(#scaleGold)"/>
    <circle cx="0" cy="-5" r="5" fill="#f59e0b"/>
    <line x1="-40" y1="-2" x2="-40" y2="18" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="-30" y1="-2" x2="-30" y2="18" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M-50 18 L-30 18 L-35 30 L-45 30 Z" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <line x1="30" y1="-2" x2="30" y2="18" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="40" y1="-2" x2="40" y2="18" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M30 18 L50 18 L45 30 L35 30 Z" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <rect x="-44" y="14" width="8" height="6" rx="1" fill="#fcd34d" opacity="0.7"/>
    <rect x="36" y="14" width="8" height="6" rx="1" fill="#fcd34d" opacity="0.7"/>
  </g>

  <!-- Text -->
  <text x="400" y="420" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="4">GenLayer</text>
  <text x="400" y="475" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="url(#blueText)" text-anchor="middle" letter-spacing="10">CONTRACT JUDGE</text>
  <line x1="280" y1="495" x2="520" y2="495" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <text x="400" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle" letter-spacing="3">GENLAYER STUDIO NET</text>
</svg>